[workspace]
resolver = "3"
members = [
    "crates/openh3-assets",
    "crates/openh3-common",
    "crates/openh3-db",
    "crates/openh3-api-types",
    "crates/openh3-realtime",
    "crates/openh3-runtime",
    "crates/openh3-process",
    "crates/openh3-session",
    "crates/openh3-session-message",
    "crates/openh3-skill-runtime",
    "crates/openh3-auth",
    "crates/openh3-system",
    "crates/openh3-file",
    "crates/openh3-office",
    "crates/openh3-shell",
    "crates/openh3-ai-agent",
    "crates/openh3-mcp",
    "crates/openh3-conversation",
    "crates/openh3-extension",
    "crates/openh3-channel",
    "crates/openh3-team-prompts",
    "crates/openh3-team",
    "crates/openh3-project",
    "crates/openh3-sidebar",
    "crates/openh3-cron",
    "crates/openh3-assistant",
    "crates/openh3-app",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
# Dependency keys and library names use the OpenH3 namespace. Runtime data and
# wire-level legacy identifiers are migrated separately and are not derived
# from Rust crate names.
openh3-common = { package = "openh3-common", path = "crates/openh3-common" }
openh3-assets = { package = "openh3-assets", path = "crates/openh3-assets" }
openh3-db = { package = "openh3-db", path = "crates/openh3-db" }
openh3-api-types = { package = "openh3-api-types", path = "crates/openh3-api-types" }
openh3-realtime = { package = "openh3-realtime", path = "crates/openh3-realtime" }
openh3-runtime = { package = "openh3-runtime", path = "crates/openh3-runtime" }
openh3-process = { package = "openh3-process", path = "crates/openh3-process" }
openh3-session = { package = "openh3-session", path = "crates/openh3-session" }
openh3-session-message = { package = "openh3-session-message", path = "crates/openh3-session-message" }
openh3-skill-runtime = { package = "openh3-skill-runtime", path = "crates/openh3-skill-runtime" }
openh3-auth = { package = "openh3-auth", path = "crates/openh3-auth" }
openh3-system = { package = "openh3-system", path = "crates/openh3-system" }
openh3-file = { package = "openh3-file", path = "crates/openh3-file" }
openh3-office = { package = "openh3-office", path = "crates/openh3-office" }
openh3-shell = { package = "openh3-shell", path = "crates/openh3-shell" }
openh3-ai-agent = { package = "openh3-ai-agent", path = "crates/openh3-ai-agent" }
openh3-mcp = { package = "openh3-mcp", path = "crates/openh3-mcp" }
openh3-conversation = { package = "openh3-conversation", path = "crates/openh3-conversation" }
openh3-extension = { package = "openh3-extension", path = "crates/openh3-extension" }
openh3-channel = { package = "openh3-channel", path = "crates/openh3-channel" }
openh3-team-prompts = { package = "openh3-team-prompts", path = "crates/openh3-team-prompts" }
openh3-team = { package = "openh3-team", path = "crates/openh3-team" }
openh3-project = { package = "openh3-project", path = "crates/openh3-project" }
openh3-sidebar = { package = "openh3-sidebar", path = "crates/openh3-sidebar" }
openh3-cron = { package = "openh3-cron", path = "crates/openh3-cron" }
openh3-assistant = { package = "openh3-assistant", path = "crates/openh3-assistant" }
openh3-app = { package = "openh3-app", path = "crates/openh3-app" }

aion-agent = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-providers = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-tools = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-protocol = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-mcp = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }

# Core framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
http = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async utilities
futures-util = "0.3"

# Async trait (dyn-compatible async traits)
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# CLI
clap = { version = "4", features = ["derive"] }
# No-echo password prompt for the `user set-password` bootstrap CLI (win/mac/linux).
rpassword = "7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Auth / Crypto
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"

# UUID
uuid = { version = "1", features = ["v7"] }
url = "2"

# HTTP client — use rustls with native roots to align backend trust with the host system.
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls-native-roots"], default-features = false }

# Concurrency
dashmap = "6"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# Protobuf
prost = "0.13"

# Semver
semver = "1"

# Directories
dirs = "6"

# Regex
regex = "1"

# File system
dunce = "1"
include_dir = "0.7"
notify = "8"
walkdir = "2"
ignore = "0.4"
zip = "2"
git2 = { version = "0.21.0", default-features = false }
# Source-control discard sends untracked files to the platform trash instead of
# unlinking them (mac/win/linux, x64 + arm64).
trash = "5"
mime_guess = "2"
rust-embed = "8"

# Runtime embedding
fs2 = "0.4"
zstd = "0.13"

# Cron
cron = "0.15"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Shell
open = "5"
which = "7"
# Text-only clipboard. default-features off: `image-data` pulls `image`/`zune-jpeg`
# which we don't use and currently fails to build. No `wayland-data-control` either:
# it pulls wl-clipboard-rs → wayland-scanner (build-time) → the vulnerable quick-xml
# 0.39 (RUSTSEC-2026-0194/0195). Without it, arboard uses its unconditional x11rb
# backend on Linux (works under X11/XWayland); macOS/Windows unaffected.
arboard = { version = "3", default-features = false }

# Office
calamine = "0.36"
rust_xlsxwriter = "0.82"
sha1 = "0.10"
sha2 = "0.10"

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrock = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"

# Pin rustls-webpki to fix RUSTSEC-2026-{0098,0099,0104}
rustls-webpki = "0.103.13"

# OAuth / MCP
oauth2 = "5.0.0-rc.1"
toml = "0.8"

# Ed25519
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Encoding
base64 = "0.22"

# HTTP body utilities (testing)
http-body-util = "0.1"

# Testing
tempfile = "3"
wiremock = "0.6"
proptest = "1"

# Random
getrandom = "0.2"
hex = "0.4"
libc = "0.2"

# Shrink target/debug: minimal debuginfo, sidecar files, no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

# Keep the MCP transport fix in version control. The upstream v0.2.11
# implementation uses a fixed JSON-RPC id for tools/call, which is unsafe for
# concurrent Streamable HTTP/SSE requests.
[patch."https://github.com/iOfficeAI/aionrs.git"]
aion-mcp = { path = "vendor/aion-mcp" }
