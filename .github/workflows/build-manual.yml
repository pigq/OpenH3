name: '🔨 Manual Build'

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation to run (content publication never builds desktop installers)'
        required: true
        type: choice
        options:
          - build
          - official-content
          - windows-upgrade-acceptance
        default: 'build'
      branch:
        description: 'Branch to build from (build mode only)'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      openh3_core_run_id:
        description: 'Optional OpenH3 Core Manual Build workflow run id to bundle instead of the pinned release'
        required: false
        type: string
        default: ''
      aioncore_run_id:
        description: 'Deprecated alias for openh3_core_run_id'
        required: false
        type: string
        default: ''
      content_source:
        description: 'Approved editorial source JSON in the dispatched main commit (official-content only)'
        required: false
        type: string
        default: 'content-source/catalog-source.json'
      content_sequence:
        description: 'Required strictly increasing sequence, including rollback (official-content only)'
        required: false
        type: string
        default: ''
      rollback_reason:
        description: 'Audited reason for older payload, at least 8 characters (official-content only)'
        required: false
        type: string
        default: ''

      reviewed_source_sha:
        description: 'Required for acceptance mode: reviewed full SHA, equal to this dispatch commit'
        required: false
        type: string
        default: ''

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    if: inputs.mode == 'build'
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-15-intel","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX_X64='{"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"}'
          LINUX_ARM64='{"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux-x64" ]; then
            MATRIX="{\"include\":[$LINUX_X64]}"
          elif [ "$PLATFORM" = "linux-arm64" ]; then
            MATRIX="{\"include\":[$LINUX_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    if: inputs.mode == 'build'
    needs: prepare-matrix
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      openh3_core_run_id: ${{ inputs.openh3_core_run_id || inputs.aioncore_run_id }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit

  publish-official-content:
    name: Publish official content catalog
    if: inputs.mode == 'official-content' && github.repository == 'pigq/OpenH3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: official-content
    permissions:
      contents: write
    concurrency:
      group: official-content-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate approved content and media
        env:
          CONTENT_SOURCE: ${{ inputs.content_source }}
          CONTENT_SEQUENCE: ${{ inputs.content_sequence }}
        run: |
          set -euo pipefail
          : "${CONTENT_SOURCE:?Content source is required in official-content mode}"
          : "${CONTENT_SEQUENCE:?Content sequence is required in official-content mode}"
          WORKSPACE_REAL="$(cd -- "$GITHUB_WORKSPACE" && pwd -P)"
          SOURCE_REAL="$(realpath -e -- "$CONTENT_SOURCE")"
          case "$SOURCE_REAL" in
            "$WORKSPACE_REAL"/*) ;;
            *) echo 'Content source must be inside the reviewed checkout' >&2; exit 1 ;;
          esac
          test -f "$SOURCE_REAL"
          git --literal-pathspecs ls-files --error-unmatch -- "$CONTENT_SOURCE" >/dev/null
          node scripts/content-catalog/build.mjs --input "$CONTENT_SOURCE" --assets-dir "$(dirname "$CONTENT_SOURCE")" --out "$RUNNER_TEMP/content-build" --keyring resources/content-catalog/trusted-keys.json --sequence "$CONTENT_SEQUENCE"
          cat "$RUNNER_TEMP/content-build/changes.json"
      - name: Sign and publish immutable snapshot, then advance signed channel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNING_PEM: ${{ secrets.CONTENT_SIGNING_PRIVATE_KEY }}
          CONTENT_KEY_ID: openh3-content-20261024
          CONTENT_MIN_CLIENT: '3.0.1'
          CONTENT_ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          OPENH3_CONTENT_PRIVATE_KEY_FILE: ${{ runner.temp }}/content-private.pem
        run: |
          set -euo pipefail
          trap 'rm -f -- "$OPENH3_CONTENT_PRIVATE_KEY_FILE"' EXIT
          node --input-type=module -e "import fs from 'node:fs'; if(!process.env.SIGNING_PEM)throw Error('Missing signing key');fs.writeFileSync(process.env.OPENH3_CONTENT_PRIVATE_KEY_FILE,process.env.SIGNING_PEM,{mode:0o600,flag:'wx'});"
          node scripts/content-catalog/publish.mjs --publish --directory "$RUNNER_TEMP/content-build" --key-id "$CONTENT_KEY_ID" --keyring resources/content-catalog/trusted-keys.json --min-client-version "$CONTENT_MIN_CLIENT" --rollback-reason "$CONTENT_ROLLBACK_REASON"
      - name: Remove temporary private key
        if: always()
        env:
          OPENH3_CONTENT_PRIVATE_KEY_FILE: ${{ runner.temp }}/content-private.pem
        run: node --input-type=module -e "import fs from 'node:fs';fs.rmSync(process.env.OPENH3_CONTENT_PRIVATE_KEY_FILE,{force:true});"

  acceptance-contracts:
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    if: inputs.mode == 'windows-upgrade-acceptance' && github.repository == 'pigq/OpenH3' && github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify reviewed immutable source
        id: reviewed-source
        shell: pwsh
        env:
          REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REVIEWED_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:REVIEWED_SOURCE_SHA -cne $env:GITHUB_SHA) { throw 'Dispatch SHA was not explicitly reviewed.' }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout SHA differs.' }
          $status = & git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Tracked checkout must be clean.' }
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($package.version -cne '3.0.1') { throw 'A genuine committed 3.0.1 source version is required; never rewrite 3.0.0.' }
      - name: Frozen dependency install
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen install failed.' }
      - name: Pure harness regression
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -LiteralPath packages/shared-scripts/acceptance -Recurse -Filter '*.test.mjs' | ForEach-Object FullName)
          if ($tests.Count -lt 1) { throw 'Missing harness tests.' }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'Harness regression failed.' }

  acceptance-candidate:
    permissions:
      contents: read
      actions: read
    if: inputs.mode == 'windows-upgrade-acceptance'
    needs: acceptance-contracts
    uses: ./.github/workflows/_build-reusable.yml
    with:
      ref: ${{ github.sha }}
      matrix: '{"include":[{"platform":"windows-x64","os":"windows-2022","arch":"x64","artifact-name":"windows-x64-installed-upgrade-build","command":"node scripts/build-with-builder.js x64 --win --x64"}]}'
      skip_code_quality: false
      append_commit_hash: false
      upload_installers_only: false
      acceptance_provenance: true

  acceptance-installed:
    permissions:
      contents: read
      actions: read
    if: inputs.mode == 'windows-upgrade-acceptance'
    needs: acceptance-candidate
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [manual-migration, cancel, disconnect, corrupt, downloaded-quit, install]
    env:
      SCENARIO: ${{ matrix.scenario }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen harness dependency install
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen install failed.' }
      # No run-id/token: download-artifact can consume only this run's artifact.
      # Attempt is also in its name, so a rerun cannot reuse a prior attempt.
      - uses: actions/download-artifact@v6
        with:
          name: windows-installed-upgrade-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openh3 acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}/candidate
      - name: Real installed acceptance
        id: installed-acceptance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node packages/shared-scripts/acceptance/runner/installed-upgrade.mjs --scenario $env:SCENARIO --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Installed acceptance failed or is NOT-COVERED: $env:SCENARIO" }
      - name: Upload scenario evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/openh3 acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}/evidence/
          if-no-files-found: error
          retention-days: 7

  acceptance-gate:
    permissions:
      contents: read
      actions: read
    if: ${{ always() && inputs.mode == 'windows-upgrade-acceptance' }}
    needs: [acceptance-contracts, acceptance-candidate, acceptance-installed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v6
        with:
          pattern: windows-upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/windows-upgrade-reports
          merge-multiple: false
      - name: Require all six real installed scenario reports
        env:
          OPENH3_ACCEPTANCE_REPORTS: ${{ runner.temp }}/windows-upgrade-reports
        run: node packages/shared-scripts/acceptance/runner/flows/gate.mjs
